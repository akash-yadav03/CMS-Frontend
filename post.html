<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog post | Akash Yadav</title>
  <link rel="stylesheet" href="style.css" />
  <script src="post.js" defer></script>
</head>
<body>
  <header>
    <nav class="navbar">
      <h2 class="logo">Akash Yadav</h2>
      <a class="post-back-link" href="portfolio.html#posts">← Back to portfolio</a>
    </nav>
  </header>

  <main class="post-detail-section">
    <p id="postStatus" class="projects-status" role="status" aria-live="polite">
      Loading post...
    </p>
    <article id="postDetail" class="portfolio-post" hidden>
      <h1 id="postTitle"></h1>
      <p id="postDescription" class="post-description"></p>
      <time id="postDate"></time>
      <div id="postContent" class="post-content"></div>
    </article>
    <a class="post-back-bottom" href="portfolio.html#posts">← Back to posts</a>
  </main>
</body>
</html>
